# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
persistent_workers: true
prefetch_factor: 2
pin_memory: null  # null keeps the existing CUDA auto-detection behavior
pin_memory_device: null

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
vggt_learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
# Optional absolute step at which to checkpoint and exit this invocation.
# Unlike max_steps, this does not change the LR/reconstruction schedule.
stop_after_steps: null
log_every: 10
save_every: 100
save_weights_every: null  # null inherits save_every
save_state_every: null  # null inherits save_every
eval_every: 50
eval_rollout_every: null  # null means 5 * eval_every
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
optimizer_grouping: dtype # dtype preserves mixed parameter storage; legacy resumes old ZeRO state
vggt_fp32_storage_bf16_compute: false # opt-in: keep trainable VGGT parameters FP32, run eligible ops under BF16 autocast
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
# Optional one-shot audit used by distributed smoke tests.  It checks the
# reconstruction modules after backward and before the optimizer clears grads.
verify_reconstruction_gradients: false
resume: null

# Text-embedding precomputation: keep existing cache files when false.
# Declared here so Hydra accepts `overwrite=false` without the `+` prefix.
overwrite: true

# Optional batch/shard settings used by the dataset precomputation scripts.
# Keep them in the base config so CLI overrides are accepted for every task,
# including task configs that do not need these fields during training.
precompute_batch_size: 8
depth_cache_shard_size: 256

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  id: null
  resume: null
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
